# The normalized resource path is evaluated before try_files and cached per request.
# This strips a base prefix once, including a base named /assets/.
map $uri $template_resource_path {
    default $uri;
__BASE_RESOURCE_MAP__
}
map $template_resource_path $template_is_api {
    default 0;
    ~^/api(?:/|$) 1;
}
map $template_resource_path $template_no_history {
    default 0;
    ~^/assets/ 1;
    ~\.[^/]+$ 1;
}
map $template_resource_path $template_asset_cache_control {
    default "no-cache";
    ~*\.html$ "no-store";
    /_app.config.js "no-store";
__ASSET_CACHE_MAP__
}
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    etag on;
    if_modified_since exact;
    add_header Cache-Control $template_asset_cache_control always;
    if ($template_is_api) { return 404; }
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location / { try_files $template_resource_path @template_history; }
    location @template_history {
        if ($template_no_history) { return 404; }
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }
}
