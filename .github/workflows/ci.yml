{
  "name": "CI",
  "on": { "pull_request": {}, "push": {} },
  "permissions": { "contents": "read" },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "env": { "SKIP_INSTALL_SIMPLE_GIT_HOOKS": "1" },
  "jobs": {
    "check": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout (v7.0.1)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": { "persist-credentials": false }
        },
        {
          "name": "Set up pnpm (v6.1.0)",
          "uses": "pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413",
          "with": { "version": "11.25.0", "run_install": false }
        },
        {
          "name": "Set up project Node (v7.1.0)",
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.16.0",
            "cache": "pnpm",
            "cache-dependency-path": "pnpm-lock.yaml\n.github/workflows/ci.yml"
          }
        },
        {
          "name": "Install locked dependencies without hooks or lifecycle scripts",
          "run": "pnpm install --frozen-lockfile --ignore-scripts"
        },
        { "name": "Check formatting", "run": "pnpm format:check" },
        { "name": "Run the complete non-E2E check chain", "run": "pnpm check" }
      ]
    }
  }
}
